name: nix-update

on:
  schedule:
    - cron: "0 21 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [gwq, leaf]
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - name: Update ${{ matrix.package }}
        id: update
        working-directory: home-manager
        run: |
          nix run nixpkgs#nix-update -- --flake ${{ matrix.package }}
          echo "version=$(nix eval --raw .#${{ matrix.package }}.version)" >> "$GITHUB_OUTPUT"
      - uses: peter-evans/create-pull-request@v8
        with:
          branch: nix-update/${{ matrix.package }}
          commit-message: update ${{ matrix.package }} to ${{ steps.update.outputs.version }}
          title: update ${{ matrix.package }} to ${{ steps.update.outputs.version }}
          body: ""
          delete-branch: true
